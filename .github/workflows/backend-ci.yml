name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ChessApp.Backend.csproj

      - name: Build
        run: dotnet build ChessApp.Backend.csproj --no-restore --configuration Release

      # No test project exists yet (xunit/Moq are referenced in the main
      # project for when unit tests are added - see NEXT_STEPS_PLAN.md BE-8).
      # Once a ChessApp.Backend.Tests project exists, add:
      #   - name: Test
      #     run: dotnet test --no-build --configuration Release
