name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        id: restore
        run: |
          set -o pipefail
          dotnet restore ChessApp.Backend.csproj 2>&1 | tee restore.log

      - name: Build
        id: build
        if: success()
        run: |
          set -o pipefail
          dotnet build ChessApp.Backend.csproj --no-restore --configuration Release 2>&1 | tee build.log

      # Surface failures as check-run annotations, queryable via the plain
      # REST API (api.github.com), since the raw log download endpoint
      # redirects to Azure Blob Storage which isn't reachable from every
      # client. This turns the last lines of whichever step failed into
      # ::error:: lines GitHub attaches to the check run.
      - name: Surface failure as annotations
        if: failure()
        run: |
          for f in restore.log build.log; do
            if [ -f "$f" ]; then
              echo "----- tail of $f -----"
              tail -n 60 "$f" | while IFS= read -r line; do
                # Strip characters that break the ::error:: workflow command
                clean=$(echo "$line" | tr -d '\r')
                echo "::error::$clean"
              done
            fi
          done

      # No test project exists yet (xunit/Moq are referenced in the main
      # project for when unit tests are added - see NEXT_STEPS_PLAN.md BE-8).
      # Once a ChessApp.Backend.Tests project exists, add:
      #   - name: Test
      #     run: dotnet test --no-build --configuration Release
