name: Video to Lichess prototype

on:
  push:
    branches: [ main ]
    paths: [ 'tools/video-to-lichess/**', '.github/workflows/video-to-lichess.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'tools/video-to-lichess/**', '.github/workflows/video-to-lichess.yml' ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/video-to-lichess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
